# =====================================================================
# Grafana Mimir — monolithic mode, long-term storage in an S3 bucket
#
# Run with  -config.expand-env=true  so ${VARS} below come from the container environment
# (docker-compose.yml / .env). Defaults point at the bundled MinIO; for REAL AWS S3 set in .env:
#   S3_ENDPOINT=s3.eu-west-1.amazonaws.com   S3_INSECURE=false   S3_REGION=eu-west-1
#   S3_ACCESS_KEY=...  S3_SECRET_KEY=...     MIMIR_BLOCKS_BUCKET=<your-bucket>
# =====================================================================
target: all
multitenancy_enabled: false          # single tenant -> no X-Scope-OrgID header needed

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: warn

# One S3 definition shared by blocks / ruler / alertmanager storage
common:
  storage:
    backend: s3
    s3:
      endpoint: ${S3_ENDPOINT}
      access_key_id: ${S3_ACCESS_KEY}
      secret_access_key: ${S3_SECRET_KEY}
      region: ${S3_REGION}
      insecure: ${S3_INSECURE}

blocks_storage:                       # the TSDB blocks = your metrics, persisted in S3
  s3:
    bucket_name: ${MIMIR_BLOCKS_BUCKET}
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/tsdb                   # local WAL + head block (shipped to S3 every ~2h)

ruler_storage:
  s3:
    bucket_name: ${MIMIR_RULER_BUCKET}

ruler:
  rule_path: /data/ruler

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore: { store: memberlist }

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore: { store: memberlist }

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore: { store: memberlist }
    replication_factor: 1

store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore: { store: memberlist }

limits:
  compactor_blocks_retention_period: 30d    # how long blocks stay in S3
  ingestion_rate: 50000
  ingestion_burst_size: 500000
  max_global_series_per_user: 1000000
  out_of_order_time_window: 5m              # OTLP batches can arrive slightly out of order

usage_stats:
  enabled: false
