# =====================================================================
#  OTel Collector ──(OTLP/JSON over HTTP)──► Logstash ──► Elasticsearch (Kibana)
#                                                     └─► S3 bucket (long-term archive)
#
# The collector's otlphttp exporter posts batches shaped like
#   {"resourceLogs":[{"resource":{"attributes":[..]},"scopeLogs":[{"logRecords":[ {..}, {..} ]}]}]}
# We explode that into ONE event per log record and flatten OTLP's typed attribute lists
# ([{key,value:{stringValue}}]) into ordinary ECS-style fields.
# =====================================================================
input {
  http {
    port          => 8080
    codec         => "json"
    response_code => 200
  }
}

filter {
  # not an OTLP log payload (e.g. a probe) -> ignore
  if ![resourceLogs] { drop { } }

  split { field => "resourceLogs" }
  split { field => "[resourceLogs][scopeLogs]" }
  split { field => "[resourceLogs][scopeLogs][logRecords]" }

  ruby { path => "/usr/share/logstash/pipeline/flatten_otlp.rb" }

  mutate {
    remove_field => [ "resourceLogs", "headers", "host", "http", "url", "user_agent", "@version", "event" ]
  }
}

output {
  # 1) searchable logs -> Kibana.  Data stream logs-shopease-default (ILM + template: see es-setup)
  elasticsearch {
    hosts                 => ["http://elasticsearch:9200"]
    data_stream           => true
    data_stream_type      => "logs"
    data_stream_dataset   => "shopease"
    data_stream_namespace => "default"
  }

  # 2) cheap durable archive -> S3 bucket (MinIO by default, AWS S3 in prod). Gzipped JSON lines,
  #    partitioned by day: s3://<bucket>/logs/2026/10/21/ls.s3.<uuid>.<time>.part0.txt.gz
  #    ${VAR:default} is substituted when the pipeline loads, so the conditional below picks the right
  #    block for MinIO (path-style addressing) vs AWS S3 (virtual-hosted style).
  if "${S3_PATH_STYLE:true}" == "true" {
    s3 {
      endpoint                            => "${S3_ENDPOINT_URL:http://minio:9000}"
      access_key_id                       => "${S3_ACCESS_KEY}"
      secret_access_key                   => "${S3_SECRET_KEY}"
      region                              => "${S3_REGION:us-east-1}"
      bucket                              => "${LOGS_ARCHIVE_BUCKET:elk-logs-archive}"
      prefix                              => "logs/%{+YYYY}/%{+MM}/%{+dd}/"
      additional_settings                 => { "force_path_style" => true }
      validate_credentials_on_root_bucket => false
      codec                               => "json_lines"
      encoding                            => "gzip"
      rotation_strategy                   => "size_and_time"
      size_file                           => 10485760     # 10 MiB
      time_file                           => 5            # minutes
      temporary_directory                 => "/tmp/logstash-s3"
    }
  } else {
    s3 {
      region                              => "${S3_REGION:us-east-1}"
      access_key_id                       => "${S3_ACCESS_KEY}"
      secret_access_key                   => "${S3_SECRET_KEY}"
      bucket                              => "${LOGS_ARCHIVE_BUCKET:elk-logs-archive}"
      prefix                              => "logs/%{+YYYY}/%{+MM}/%{+dd}/"
      validate_credentials_on_root_bucket => false
      codec                               => "json_lines"
      encoding                            => "gzip"
      rotation_strategy                   => "size_and_time"
      size_file                           => 10485760
      time_file                           => 5
      temporary_directory                 => "/tmp/logstash-s3"
    }
  }
}
