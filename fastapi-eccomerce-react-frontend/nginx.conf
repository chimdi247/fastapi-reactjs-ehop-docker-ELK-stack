server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

  # Optional same-origin API (used when the app is built with VITE_BACKEND_URL=""). Docker DNS is
  # resolved at request time so nginx still starts if the API is briefly down.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://ecommerce-api:8084;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;          # product / avatar image uploads
    proxy_read_timeout 60s;
  }

  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # React Router: any unknown path serves the SPA shell
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
